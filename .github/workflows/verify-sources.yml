name: Verify external sources

on:
  pull_request:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify changed theme source
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          entries="$(printf '%s\n' "$changed" | awk -F/ '$1 == "entries" && $2 != "" { print $2 }' | sort -u)"
          count="$(printf '%s\n' "$entries" | sed '/^$/d' | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo 'No entry changes; source verification is not required.'
            exit 0
          fi
          if [ "${{ github.event.pull_request.head.ref }}" = "automation/catalog-sync" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            entry_list="$(printf '%s\n' "$entries" | paste -sd, -)"
            npm run sources:check -- --entries "$entry_list"
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo 'Expected at most one changed entry directory.'
            printf '%s\n' "$entries"
            exit 1
          fi
          npm run sources:check -- --entry "$entries"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
