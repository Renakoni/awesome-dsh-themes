name: Check contribution scope

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require one contribution directory and no generated edits
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          if [ "${{ github.event.pull_request.head.ref }}" = "automation/catalog-sync" ]; then
            unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(data/catalog\.json|previews/[a-z0-9][a-z0-9.-]*\.webp)$' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Catalog automation PR contains unexpected files:'
              printf '%s\n' "$unexpected"
              exit 1
            fi
            echo 'Catalog automation scope accepted.'
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fxq 'data/catalog.json'; then
            echo 'Do not edit generated data/catalog.json in a contribution PR.'
            exit 1
          fi
          entries="$(printf '%s\n' "$changed" | awk -F/ '$1 == "entries" && $2 != "" { print $2 }' | sort -u)"
          count="$(printf '%s\n' "$entries" | sed '/^$/d' | wc -l)"
          if [ "$count" -gt 1 ]; then
            echo 'A contribution PR may contain only one entries/<theme-id> directory.'
            printf '%s\n' "$entries"
            exit 1
          fi
          echo "Contribution scope accepted."
