name: Generate catalog index

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "themes/**"
      - "data/schema.json"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: appearance-catalog-sync
  cancel-in-progress: true

jobs:
  generate:
    if: "${{ github.event_name != 'push' || !contains(toJSON(github.event.commits), 'chore(catalog): sync upstream themes') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync upstream theme commits
        id: sources
        run: npm run sources:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build previews
        if: github.event_name != 'schedule' || steps.sources.outputs.changed == 'true'
        run: npm run previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run themes
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CATALOG_SYNC_TOKEN || github.token }}
          branch: automation/catalog-sync
          delete-branch: true
          commit-message: "chore(catalog): sync upstream themes"
          title: "chore(catalog): sync upstream themes"
          body: "Daily upstream commit, version, preview, Stars, and catalog refresh. Theme installs remain pinned to the full commit SHA recorded in this pull request."
          add-paths: |
            entries/*/theme.yml
            data/catalog.json
            previews/*.webp
            THEMES.md
            THEMES.en.md
            README.md
            README.en.md
