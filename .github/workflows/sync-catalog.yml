name: Generate catalog index

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "themes/**"
      - "data/schema.json"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: appearance-catalog-sync
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run previews
      - run: npm run catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run themes
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/catalog-sync
          delete-branch: true
          commit-message: "chore(catalog): regenerate appearance assets"
          title: "chore(catalog): regenerate appearance assets"
          body: "Automated catalog index and WebP preview refresh."
          add-paths: |
            data/catalog.json
            previews/*.webp
            THEMES.md
            THEMES.en.md
