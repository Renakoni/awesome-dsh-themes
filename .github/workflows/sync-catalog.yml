name: Generate catalog index

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "themes/**"
      - "data/schema.json"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "17 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: appearance-catalog-sync
  cancel-in-progress: true

jobs:
  generate:
    if: "${{ github.event_name != 'push' || !contains(toJSON(github.event.commits), 'chore(catalog): sync upstream themes') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync upstream theme commits
        id: sources
        run: npm run sources:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build previews
        if: github.event_name != 'schedule' || steps.sources.outputs.changed == 'true'
        run: npm run previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run themes
      - uses: peter-evans/create-pull-request@v8
        id: catalog-pr
        with:
          token: ${{ secrets.CATALOG_SYNC_TOKEN || github.token }}
          branch: automation/catalog-sync
          delete-branch: true
          commit-message: "chore(catalog): sync upstream themes"
          title: "chore(catalog): sync upstream themes"
          body: "Upstream commit, version, preview, Stars, and catalog refresh. This PR merges automatically after all required checks pass. Theme installs remain pinned to the full commit SHA recorded in this pull request."
          add-paths: |
            entries/*/theme.yml
            data/catalog.json
            previews/*.webp
            THEMES.md
            THEMES.en.md
            README.md
            README.en.md
      - name: Merge validated catalog update
        if: ${{ steps.catalog-pr.outputs.pull-request-operation == 'created' || steps.catalog-pr.outputs.pull-request-operation == 'updated' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
          PR_NUMBER: ${{ steps.catalog-pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.catalog-pr.outputs.pull-request-head-sha }}
        run: |
          for attempt in $(seq 1 12); do
            check_names="$(gh pr checks "$PR_NUMBER" --required --json name --jq '.[].name' 2>/dev/null || true)"
            if printf '%s\n' "$check_names" | grep -Fxq 'scope' \
              && printf '%s\n' "$check_names" | grep -Fxq 'sources' \
              && printf '%s\n' "$check_names" | grep -Fxq 'validate'; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo 'Required checks were not registered within two minutes.'
              exit 1
            fi
            sleep 10
          done

          gh pr checks "$PR_NUMBER" --required --watch --fail-fast
          gh pr merge "$PR_NUMBER" --squash --admin --delete-branch --match-head-commit "$PR_HEAD_SHA"
